# Deploy the client-side Rocq comparator to GitHub Pages.
#
# This site is 100% static: index.html + styles.css + app.js + the worker glue
# (rocq_comparator.js / rocq_worker.js) + the prebuilt js_of_ocaml engine
# (dist/rocq_engine.js). There is NO server-side code.
#
# Why this workflow does not build the engine:
#   dist/rocq_engine.js is a js_of_ocaml build of a *patched* rocq-runtime 9.2
#   kernel + the rocq-comparator library (see BACKEND.md). Reproducing it needs
#   a full opam switch with the Rocq sources and a patched kernel.cma overlay —
#   not feasible on a stock GitHub Actions runner. So the engine is committed to
#   the repo under dist/ and this workflow only (re)assembles the static bundle
#   from the committed frontend sources (`make site`) and publishes dist/.
#
#   If dist/rocq_engine.js is NOT committed, the page still deploys and works:
#   it falls back to the demo-verdict path (the live in-browser check is simply
#   disabled). See README "Deploying to GitHub Pages".
#
# Base path: this is a project page served under https://<user>.github.io/<repo>/.
# Every asset in index.html is referenced by a RELATIVE path (styles.css,
# app.js, rocq_comparator.js), and the worker loads rocq_worker.js /
# rocq_engine.js by relative path too, so the site works unchanged under any
# sub-path — no <base> tag or rewrite needed.
#
# Headers: the engine is pure js_of_ocaml (no WebAssembly, no SharedArrayBuffer),
# so it needs NO COOP/COEP headers and runs on GitHub Pages as-is. (A future
# wasm_of_ocaml build using threads/SharedArrayBuffer WOULD need COOP/COEP, which
# GitHub Pages cannot set — see README for the caveat and workaround.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the static site (make site)
        run: make site

      - name: Warn if the engine is missing (demo-only deploy)
        run: |
          if [ ! -f dist/rocq_engine.js ]; then
            echo "::warning::dist/rocq_engine.js not committed — deploying demo-verdict fallback only (live in-browser check disabled)."
          else
            echo "engine present ($(wc -c < dist/rocq_engine.js) bytes) — live in-browser check enabled."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
