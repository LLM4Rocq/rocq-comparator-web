# Deploy the client-side Rocq comparator to GitHub Pages.
#
# This site is 100% static: index.html + styles.css + app.js + the worker glue
# (rocq_comparator.js / rocq_worker.js) + the prebuilt WASM engine — the
# wasm_of_ocaml glue (dist/rocq_engine.js), its module (dist/rocq_engine.assets/
# code-*.wasm), and the JS BigInt zarith backend (dist/rocq_zarith.js). There is
# NO server-side code.
#
# Why this workflow does not build the engine:
#   the engine is a wasm_of_ocaml build of a *patched* rocq-runtime 9.2 kernel +
#   the rocq-comparator library (see BACKEND.md). Reproducing it needs a full
#   opam switch with the Rocq sources and a patched kernel.cma overlay — not
#   feasible on a stock GitHub Actions runner. So the engine (glue + .wasm +
#   rocq_zarith.js) is committed under dist/ and this workflow only (re)assembles
#   the static bundle from the committed frontend sources (`make site`) and
#   publishes dist/.
#
#   If dist/rocq_engine.js is NOT committed, the page still deploys and works:
#   it falls back to the demo-verdict path (the live in-browser check is simply
#   disabled). See README "Deploying to GitHub Pages".
#
# Base path: this is a project page served under https://<user>.github.io/<repo>/.
# Every asset in index.html is referenced by a RELATIVE path (styles.css,
# app.js, rocq_comparator.js), and the worker loads rocq_worker.js /
# rocq_engine.js by relative path too, so the site works unchanged under any
# sub-path — no <base> tag or rewrite needed.
#
# MIME / headers: the .wasm module must be served as application/wasm — GitHub
# Pages does this by extension, so no config is needed. The engine is
# single-threaded (no SharedArrayBuffer, no wasm threads), so it needs NO
# COOP/COEP headers and runs on Pages as-is. The shipped build uses the JSPI
# effects backend (works in Node 24+ and Chrome/Edge >=137); for Safari/Firefox
# rebuild with WOO_EFFECTS=cps (a larger, universal .wasm) — see README.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the static site (make site)
        run: make site

      - name: Warn if the engine is missing (demo-only deploy)
        run: |
          if [ ! -f dist/rocq_engine.js ]; then
            echo "::warning::dist/rocq_engine.js not committed — deploying demo-verdict fallback only (live in-browser check disabled)."
          else
            wasm=$(ls dist/rocq_engine.assets/*.wasm 2>/dev/null | head -1); \
            echo "engine present (glue $(wc -c < dist/rocq_engine.js) B + wasm $(wc -c < "$wasm" 2>/dev/null) B) — live in-browser check enabled."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
