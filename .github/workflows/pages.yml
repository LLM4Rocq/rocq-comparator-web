# Deploy the client-side Rocq comparator to GitHub Pages.
#
# This site is 100% static: index.html + styles.css + app.js + the worker glue
# (rocq_comparator.js / rocq_worker.js) + the byte-exact mount conversion
# (rocq_bytes.js) + the JS BigInt zarith backend (rocq_zarith.js) + TWO prebuilt
# WebAssembly engines, each a wasm_of_ocaml glue .js plus its module:
#   dist/engine-cps/rocq_engine.js  + dist/engine-cps/rocq_engine.assets/code-*.wasm
#   dist/engine-jspi/rocq_engine.js + dist/engine-jspi/rocq_engine.assets/code-*.wasm
# There is NO server-side code and NO js_of_ocaml backend.
#
# cps is the UNIVERSAL default (all browsers + any Node); jspi is a smaller/faster
# upgrade the worker loads only where JSPI exists (Chrome/Edge 137+, Node 24+).
# The worker feature-detects at load and each visitor fetches exactly ONE engine.
#
# Why this workflow does not build the engines:
#   an engine is a wasm_of_ocaml build of a *patched* rocq-runtime 9.2 kernel +
#   the rocq-comparator library (see BACKEND.md). Reproducing it needs a full
#   opam switch with the Rocq sources and a patched kernel.cma overlay — not
#   feasible on a stock GitHub Actions runner. So both engines (glue + .wasm) plus
#   rocq_bytes.js / rocq_zarith.js are committed under dist/ and this workflow only
#   (re)assembles the static bundle from the committed frontend (`make site`) and
#   publishes dist/.
#
#   If neither engine is committed, the page still deploys and works: it falls
#   back to the demo-verdict path (the live check is disabled). See README
#   "Deploying to GitHub Pages".
#
# Base path: this is a project page served under https://<user>.github.io/<repo>/.
# Every asset in index.html is referenced by a RELATIVE path, and the worker
# loads rocq_bytes.js / rocq_zarith.js and engine-<variant>/rocq_engine.js by
# relative path too (the engine's .wasm is fetched relative to the worker's URL),
# so the site works unchanged under any sub-path — no <base> tag or rewrite.
#
# MIME / headers: the .wasm modules must be served as application/wasm — GitHub
# Pages does this by extension, so no config is needed. The engines are
# single-threaded (no SharedArrayBuffer, no wasm threads), so they need NO
# COOP/COEP headers and run on Pages as-is.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the static site (make site)
        run: make site

      - name: Report engine payload (or warn if missing)
        run: |
          any=0
          for eff in cps jspi; do
            glue="dist/engine-$eff/rocq_engine.js"
            if [ -f "$glue" ]; then
              any=1
              wasm=$(ls dist/engine-$eff/rocq_engine.assets/*.wasm 2>/dev/null | head -1)
              echo "engine-$eff present (glue $(wc -c < "$glue") B + wasm $(wc -c < "$wasm" 2>/dev/null) B)."
            fi
          done
          if [ "$any" = "0" ]; then
            echo "::warning::no engine committed under dist/engine-cps or dist/engine-jspi — deploying demo-verdict fallback only (live in-browser check disabled)."
          else
            echo "live in-browser check enabled (cps default; jspi upgrade where available)."
          fi

      # Gate the deploy on the site working in a REAL browser: the runner's
      # Chrome loads dist/ over HTTP, the worker + engines start, and proofs are
      # checked (both engine variants). Node-only tests miss the Worker/fetch seams.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Smoke-test the site in headless Chrome (make test-browser)
        run: BROWSER=google-chrome make test-browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
